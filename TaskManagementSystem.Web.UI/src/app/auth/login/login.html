<!-- [ auth-signin ] start -->
<div class="auth-wrapper">
  <div class="auth-content text-center">
    <img src="assets/images/logo.png" alt="" class="img-fluid mb-4">

    <div class="card borderless">
      <div class="row align-items-center">
        <div class="col-md-12">
          <div class="card-body">
            <h4 class="mb-3 f-w-400">Signin</h4>
            <hr>

            <!-- Username -->
            <div class="form-group mb-3">
              <input
                type="text"
                class="form-control"
                [class.is-invalid]="userNameError"
                id="UserName"
                name="userName"
                placeholder="Username"
                autocomplete="username"
                [(ngModel)]="userName"
                [disabled]="isLoading"
                (keyup.enter)="signin()">
              <div *ngIf="userNameError" class="invalid-feedback d-block text-left">
                {{ userNameError }}
              </div>
            </div>

            <!-- Password -->
            <div class="form-group mb-4 position-relative">
              <input
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                [class.is-invalid]="passwordError"
                id="Password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                [(ngModel)]="password"
                [disabled]="isLoading"
                (keyup.enter)="signin()">
              <a href="#!"
                 class="text-muted"
                 style="position:absolute; right:12px; top:10px;"
                 (click)="togglePasswordVisibility(); $event.preventDefault();">
                <i class="feather"
                   [ngClass]="showPassword ? 'icon-eye-off' : 'icon-eye'"></i>
              </a>
              <div *ngIf="passwordError" class="invalid-feedback d-block text-left">
                {{ passwordError }}
              </div>
            </div>

            <!-- Remember me -->
            <div class="custom-control custom-checkbox text-left mb-4 mt-2">
              <input
                type="checkbox"
                class="custom-control-input"
                id="customCheck1"
                name="rememberMe"
                [(ngModel)]="rememberMe"
                [disabled]="isLoading">
              <label class="custom-control-label" for="customCheck1">Save credentials.</label>
            </div>

            <!-- Global error -->
            <div *ngIf="errorMessage" class="alert alert-danger py-2 mb-3">
              {{ errorMessage }}
            </div>

            <!-- Submit -->
            <button
              class="btn btn-block btn-primary mb-4"
              type="button"
              (click)="signin()"
              [disabled]="isLoading">
              <span *ngIf="!isLoading">Signin</span>
              <span *ngIf="isLoading">
                <i class="feather icon-loader"></i> Signing in…
              </span>
            </button>

            <hr>
            <p class="mb-2 text-muted">
              Forgot password?
              <a href="#!" class="f-w-400" (click)="onForgotPassword($event)">Reset</a>
            </p>
            <p class="mb-0 text-muted">
              Don’t have an account?
              <a href="#!" class="f-w-400">Signup</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- [ auth-signin ] end -->
