<div class="card">
  <div class="card-header d-flex align-items-center justify-content-between">
    <h5 class="mb-0">
      <i class="feather icon-message-circle mr-1"></i>
      Comments ({{ comments.length }})
    </h5>
    <button class="btn btn-sm btn-light"
            (click)="loadComments()"
            [disabled]="isLoading"
            title="Refresh">
      <i class="feather icon-refresh-cw"></i>
    </button>
  </div>

  <div class="card-body">

    <!-- Loading -->
    <div *ngIf="isLoading" class="text-center py-3 text-muted">
      <i class="feather icon-loader"></i> Loading comments…
    </div>

    <!-- Empty -->
    <div *ngIf="!isLoading && comments.length === 0"
         class="text-center py-4 text-muted">
      <i class="feather icon-message-square f-30"></i>
      <p class="mb-0 mt-2">No comments yet. Be the first to comment!</p>
    </div>

    <!-- Comment list -->
    <div class="comment-list" *ngIf="!isLoading && comments.length > 0">
      <div *ngFor="let c of comments; trackBy: trackByCommentId"
           class="comment-item"
           [class.mine]="isMine(c)">

        <div class="avatar-circle-sm">{{ initials(c.userName) }}</div>

        <div class="comment-body">
          <div class="comment-meta">
            <strong>{{ c.userName }}</strong>
            <span class="text-muted ml-2 small">
              {{ c.createdOn | date:'short' }}
            </span>
            <span *ngIf="isMine(c)" class="badge badge-light-primary ml-2">You</span>
          </div>
          <div class="comment-text">{{ c.comment }}</div>
        </div>
      </div>
    </div>

    <!-- New comment box -->
    <div class="comment-input mt-3" *ngIf="!isLoading">
      <div class="d-flex align-items-start">
        <div class="avatar-circle-sm mr-2">
          {{ account.getUserInitials() }}
        </div>
        <div class="flex-grow-1">
          <textarea class="form-control"
                    rows="2"
                    placeholder="Write a comment…"
                    maxlength="1000"
                    [(ngModel)]="newComment"
                    [disabled]="isPosting"></textarea>
          <div class="d-flex justify-content-between align-items-center mt-2">
            <small class="text-muted">
              {{ newComment.length }} / 1000
            </small>
            <button class="btn btn-primary btn-sm"
                    (click)="postComment()"
                    [disabled]="isPosting || !newComment.trim()">
              <i class="feather icon-send"></i>
              <span *ngIf="!isPosting">Post Comment</span>
              <span *ngIf="isPosting">Posting…</span>
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
