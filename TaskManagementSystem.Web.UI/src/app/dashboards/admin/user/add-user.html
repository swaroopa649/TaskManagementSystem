<!-- [ breadcrumb ] start -->
<div class="page-header">
  <div class="page-block">
    <div class="row align-items-center">
      <div class="col-md-12">
        <div class="page-header-title">
          <h5 class="m-b-10">Add User</h5>
        </div>
        <ul class="breadcrumb">
          <li class="breadcrumb-item"><a href="#!"><i class="feather icon-home"></i></a></li>
          <li class="breadcrumb-item"><a routerLink="/admin/users">Users</a></li>
          <li class="breadcrumb-item"><a href="#!">Add User</a></li>
        </ul>
      </div>
    </div>
  </div>
</div>
<!-- [ breadcrumb ] end -->

<div class="row">
  <div class="col-md-8 col-lg-6 mx-auto">
    <div class="card">
      <div class="card-header">
        <h5>New User Details</h5>
      </div>
      <div class="card-body">

        <form #userForm="ngForm" (ngSubmit)="onSubmit(userForm)" novalidate>

          <!-- First Name -->
          <div class="form-group mb-3">
            <label class="form-label">First Name <span class="text-danger">*</span></label>
            <input type="text"
                   name="firstName"
                   class="form-control"
                   placeholder="Enter first name"
                   required
                   minlength="2"
                   maxlength="50"
                   [(ngModel)]="model.firstName"
                   #firstName="ngModel">
            <div *ngIf="firstName.invalid && (firstName.dirty || firstName.touched)"
                 class="text-danger small mt-1">
              First name is required (min 2 characters).
            </div>
          </div>

          <!-- Last Name -->
          <div class="form-group mb-3">
            <label class="form-label">Last Name <span class="text-danger">*</span></label>
            <input type="text"
                   name="lastName"
                   class="form-control"
                   placeholder="Enter last name"
                   required
                   minlength="2"
                   maxlength="50"
                   [(ngModel)]="model.lastName"
                   #lastName="ngModel">
            <div *ngIf="lastName.invalid && (lastName.dirty || lastName.touched)"
                 class="text-danger small mt-1">
              Last name is required (min 2 characters).
            </div>
          </div>

          <!-- Email -->
          <div class="form-group mb-3">
            <label class="form-label">Email <span class="text-danger">*</span></label>
            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="user@example.com"
                   required
                   email
                   [(ngModel)]="model.email"
                   #email="ngModel">
            <div *ngIf="email.invalid && (email.dirty || email.touched)"
                 class="text-danger small mt-1">
              Please enter a valid email.
            </div>
          </div>

          <!-- Phone -->
          <div class="form-group mb-3">
            <label class="form-label">Phone</label>
            <input type="tel"
                   name="phone"
                   class="form-control"
                   placeholder="Optional"
                   maxlength="20"
                   [(ngModel)]="model.phone">
          </div>

          <!-- Role -->
          <div class="form-group mb-3">
            <label class="form-label">Role <span class="text-danger">*</span></label>
            <select name="roleId"
                    class="form-control"
                    required
                    [(ngModel)]="model.roleId"
                    #roleId="ngModel">
              <option [ngValue]="null" disabled>Select a role…</option>
              <option [ngValue]="1">Admin</option>
              <option [ngValue]="2">Manager</option>
              <option [ngValue]="3">User</option>
            </select>
            <div *ngIf="roleId.invalid && (roleId.dirty || roleId.touched)"
                 class="text-danger small mt-1">
              Role is required.
            </div>
          </div>

          <!-- Password -->
          <div class="form-group mb-3 position-relative">
            <label class="form-label">Password <span class="text-danger">*</span></label>
            <input [type]="showPassword ? 'text' : 'password'"
                   name="password"
                   class="form-control"
                   placeholder="Minimum 6 characters"
                   required
                   minlength="6"
                   [(ngModel)]="model.password"
                   #password="ngModel">
            <a href="#!"
               class="text-muted"
               style="position:absolute; right:12px; top:38px;"
               (click)="togglePasswordVisibility(); $event.preventDefault();">
              <i class="feather" [ngClass]="showPassword ? 'icon-eye-off' : 'icon-eye'"></i>
            </a>
            <div *ngIf="password.invalid && (password.dirty || password.touched)"
                 class="text-danger small mt-1">
              Password is required (min 6 characters).
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group mb-3">
            <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
            <input [type]="showPassword ? 'text' : 'password'"
                   name="confirmPassword"
                   class="form-control"
                   placeholder="Re-enter password"
                   required
                   [(ngModel)]="confirmPassword"
                   #confirmPwd="ngModel">
            <div *ngIf="confirmPassword && model.password !== confirmPassword"
                 class="text-danger small mt-1">
              Passwords do not match.
            </div>
          </div>

          <!-- Is Active -->
          <div class="custom-control custom-checkbox mb-4">
            <input type="checkbox"
                   class="custom-control-input"
                   id="isActive"
                   name="isActive"
                   [(ngModel)]="model.isActive">
            <label class="custom-control-label" for="isActive">Active</label>
          </div>

          <!-- Actions -->
          <div class="d-flex justify-content-end">
            <button type="button"
                    class="btn btn-secondary mr-2"
                    (click)="cancel()"
                    [disabled]="isLoading">
              Cancel
            </button>
            <button type="submit"
                    class="btn btn-primary"
                    [disabled]="userForm.invalid || isLoading">
              <span *ngIf="!isLoading">Create User</span>
              <span *ngIf="isLoading">Creating…</span>
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>
</div>
